name: Aequm Billing Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aequm-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Billing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare deployment script
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          cat > /tmp/aequm-remote-deploy.sh <<'REMOTE_SCRIPT'
          #!/usr/bin/env bash

          set -Eeuo pipefail

          APP_DIR="/opt/aequm-billing"
          BACKUP_DIR="$APP_DIR/backups"
          TIMESTAMP="$(date +%Y%m%d_%H%M%S)"
          RELEASE_DIR="/tmp/aequm-release-$TIMESTAMP"

          DEPLOY_COMMIT="__DEPLOY_COMMIT__"

          cleanup() {
            if [ -d "$RELEASE_DIR" ]; then
              git -C "$APP_DIR" worktree remove --force "$RELEASE_DIR" 2>/dev/null || true
            fi
          }

          trap cleanup EXIT

          echo "======================================"
          echo "Aequm Billing deployment"
          echo "Commit: $DEPLOY_COMMIT"
          echo "======================================"

          cd "$APP_DIR"

          echo ""
          echo "======================================"
          echo "1. Production container check"
          echo "======================================"

          docker compose ps

          echo ""
          echo "======================================"
          echo "2. Creating production DB backup"
          echo "======================================"

          mkdir -p "$BACKUP_DIR"

          BACKUP_FILE="$BACKUP_DIR/aequm_billing_${TIMESTAMP}.sql.gz"

          docker compose exec -T db \
            sh -c 'mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" \
              --single-transaction \
              --routines \
              --triggers \
              aequm_billing' \
            </dev/null \
            | gzip > "$BACKUP_FILE"

          test -s "$BACKUP_FILE"
          gzip -t "$BACKUP_FILE"

          echo "Database backup verified:"
          ls -lh "$BACKUP_FILE"

          echo ""
          echo "======================================"
          echo "3. Fetching deployment commit"
          echo "======================================"

          git fetch origin main

          echo "Deployment commit:"
          echo "$DEPLOY_COMMIT"

          git cat-file -e "$DEPLOY_COMMIT^{commit}"

          echo "Commit exists."

          echo ""
          echo "======================================"
          echo "4. Creating release worktree"
          echo "======================================"

          rm -rf "$RELEASE_DIR"

          git worktree add --detach "$RELEASE_DIR" "$DEPLOY_COMMIT"

          RELEASE_HEAD="$(git -C "$RELEASE_DIR" rev-parse HEAD)"

          echo "Release HEAD:"
          echo "$RELEASE_HEAD"

          if [ "$RELEASE_HEAD" != "$DEPLOY_COMMIT" ]; then
            echo "ERROR: Release commit does not match deployment commit."
            exit 1
          fi

          echo "Release commit verified."

          echo ""
          echo "======================================"
          echo "5. Verifying release files"
          echo "======================================"

          test -d "$RELEASE_DIR/backend"
          test -d "$RELEASE_DIR/frontend"
          test -f "$RELEASE_DIR/backend/app/main.py"
          test -f "$RELEASE_DIR/frontend/src/App.jsx"

          echo "Release files verified."

          echo ""
          echo "======================================"
          echo "6. Updating backend source"
          echo "======================================"

          tar \
            -C "$RELEASE_DIR/backend" \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='run.sh' \
            -cf - . \
            | tar -C "$APP_DIR/backend" -xf -

          echo "Backend source updated."

          echo ""
          echo "======================================"
          echo "7. Updating frontend source"
          echo "======================================"

          tar \
            -C "$RELEASE_DIR/frontend" \
            --exclude='node_modules' \
            --exclude='dist' \
            -cf - . \
            | tar -C "$APP_DIR/frontend" -xf -

          echo "Frontend source updated."

          echo ""
          echo "======================================"
          echo "8. Rebuilding Billing containers"
          echo "======================================"

          docker compose build api ui

          echo ""
          echo "======================================"
          echo "9. Restarting Billing application"
          echo "======================================"

          docker compose up -d api ui

          echo ""
          echo "======================================"
          echo "10. Restoring Billing UI network"
          echo "======================================"

          if docker network inspect projectsystem_default >/dev/null 2>&1; then
            docker network connect \
              --alias billing-ui \
              projectsystem_default \
              aequm-billing-ui-1 2>/dev/null || true

            echo "Billing UI network checked."
          else
            echo "projectsystem_default network not found; skipping."
          fi

          echo ""
          echo "======================================"
          echo "11. Waiting for Billing API"
          echo "======================================"

          HEALTHY=0

          for i in $(seq 1 30); do

            if curl -fsS \
              http://127.0.0.1:8000/api/health \
              > /dev/null 2>&1; then

              echo "Billing API is healthy."
              HEALTHY=1
              break
            fi

            echo "Waiting for API... attempt $i/30"
            sleep 2
          done

          if [ "$HEALTHY" != "1" ]; then

            echo ""
            echo "======================================"
            echo "ERROR: Billing API is unhealthy"
            echo "======================================"

            docker compose ps

            echo ""
            echo "Billing API logs:"
            docker compose logs --tail=100 api

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "12. Final container check"
          echo "======================================"

          docker compose ps

          echo ""
          echo "======================================"
          echo "13. Final deployment verification"
          echo "======================================"

          curl -fsS \
            http://127.0.0.1:8000/api/health

          echo ""

          echo ""
          echo "======================================"
          echo "Aequm Billing deployment SUCCESS"
          echo "======================================"

          REMOTE_SCRIPT

          sed -i "s/__DEPLOY_COMMIT__/${DEPLOY_COMMIT}/g" \
            /tmp/aequm-remote-deploy.sh

          chmod 700 /tmp/aequm-remote-deploy.sh

      - name: Upload deployment script
        env:
          DEPLOY_KEY: ${{ secrets.AEQUM_BILLING_SSH_KEY }}
        run: |
          set -Eeuo pipefail

          printf '%s\n' "$DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          echo "Testing SSH connection..."

          ssh \
            -i /tmp/deploy_key \
            -p 3052 \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            root@103.17.193.174 \
            "echo SSH_AUTH_OK"

          echo "Uploading deployment script..."

          scp \
            -i /tmp/deploy_key \
            -P 3052 \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            /tmp/aequm-remote-deploy.sh \
            root@103.17.193.174:/tmp/aequm-remote-deploy.sh

          echo "Deployment script uploaded."

      - name: Execute deployment
        env:
          DEPLOY_KEY: ${{ secrets.AEQUM_BILLING_SSH_KEY }}
        run: |
          set -Eeuo pipefail

          echo "Executing remote deployment..."

          ssh \
            -i /tmp/deploy_key \
            -p 3052 \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            root@103.17.193.174 \
            "bash /tmp/aequm-remote-deploy.sh"

          echo "Remote deployment finished successfully."

      - name: Cleanup runner secrets
        if: always()
        run: |
          rm -f /tmp/deploy_key
          rm -f /tmp/aequm-remote-deploy.sh