name: Aequm Billing Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aequm-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Billing v4.3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Host iCare
        env:
          DEPLOY_KEY: ${{ secrets.AEQUM_BILLING_SSH_KEY }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo "Aequm Billing v4.3 deployment"
          echo "Commit: $DEPLOY_COMMIT"
          echo "======================================"

          printf '%s\n' "$DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          echo "Testing SSH connection..."

          ssh \
            -i /tmp/deploy_key \
            -p 3052 \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            root@103.17.193.174 \
            "echo SSH_AUTH_OK"

          echo "Starting remote deployment..."

          ssh \
            -i /tmp/deploy_key \
            -p 3052 \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            root@103.17.193.174 \
            "DEPLOY_COMMIT='$DEPLOY_COMMIT' bash -s" <<'REMOTE_SCRIPT'

          set -Eeuo pipefail

          APP_DIR="/opt/aequm-billing"
          BACKUP_DIR="$APP_DIR/backups"
          TIMESTAMP="$(date +%Y%m%d_%H%M%S)"
          RELEASE_DIR="/tmp/aequm-release-$TIMESTAMP"

          cleanup() {
            if [ -d "$RELEASE_DIR" ]; then
              git -C "$APP_DIR" worktree remove --force "$RELEASE_DIR" 2>/dev/null || true
            fi
          }

          trap cleanup EXIT

          cd "$APP_DIR"

          echo ""
          echo "======================================"
          echo "1. Production container check"
          echo "======================================"

          docker compose ps

          echo ""
          echo "======================================"
          echo "2. Creating production DB backup"
          echo "======================================"

          mkdir -p "$BACKUP_DIR"

          BACKUP_FILE="$BACKUP_DIR/aequm_billing_${TIMESTAMP}.sql.gz"

          docker compose exec -T db \
            sh -c 'mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" \
              --single-transaction \
              --routines \
              --triggers \
              aequm_billing' \
            | gzip > "$BACKUP_FILE"

          test -s "$BACKUP_FILE"
          gzip -t "$BACKUP_FILE"

          echo "Backup verified:"
          ls -lh "$BACKUP_FILE"

          echo ""
          echo "======================================"
          echo "3. Fetching deployment commit"
          echo "======================================"

          git fetch origin main

          echo "Requested commit:"
          echo "$DEPLOY_COMMIT"

          echo "Checking commit..."

          git cat-file -e "$DEPLOY_COMMIT^{commit}"

          echo "Commit exists."

          echo ""
          echo "======================================"
          echo "4. Creating release worktree"
          echo "======================================"

          rm -rf "$RELEASE_DIR"

          git worktree add --detach "$RELEASE_DIR" "$DEPLOY_COMMIT"

          echo "Release commit:"
          git -C "$RELEASE_DIR" log -1 --oneline

          test "$(git -C "$RELEASE_DIR" rev-parse HEAD)" = "$DEPLOY_COMMIT"

          echo "Release commit verified."

          echo ""
          echo "======================================"
          echo "5. Verifying v4.3 files"
          echo "======================================"

          test -f "$RELEASE_DIR/db/11_v43_expense_heads.sql"
          test -f "$RELEASE_DIR/frontend/src/pages/Expenses.jsx"

          echo "v4.3 migration found."
          echo "Expenses page found."

          grep -q "Expenses" \
            "$RELEASE_DIR/frontend/src/App.jsx"

          grep -q "Employees" \
            "$RELEASE_DIR/frontend/src/App.jsx"

          grep -q "CardStatements" \
            "$RELEASE_DIR/frontend/src/App.jsx"

          echo "v4.3 frontend references verified."

          echo ""
          echo "======================================"
          echo "6. Updating backend"
          echo "======================================"

          tar \
            -C "$RELEASE_DIR/backend" \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='run.sh' \
            -cf - . \
            | tar -C "$APP_DIR/backend" -xf -

          echo "Backend updated."

          echo ""
          echo "======================================"
          echo "7. Updating frontend"
          echo "======================================"

          tar \
            -C "$RELEASE_DIR/frontend" \
            --exclude='node_modules' \
            --exclude='dist' \
            -cf - . \
            | tar -C "$APP_DIR/frontend" -xf -

          echo "Frontend updated."

          echo ""
          echo "======================================"
          echo "8. Updating v4.3 migration"
          echo "======================================"

          mkdir -p "$APP_DIR/db"

          cp \
            "$RELEASE_DIR/db/11_v43_expense_heads.sql" \
            "$APP_DIR/db/11_v43_expense_heads.sql"

          echo "Migration copied."

          echo ""
          echo "======================================"
          echo "9. Applying v4.3 database migration"
          echo "======================================"

          docker compose exec -T db \
            sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" aequm_billing' \
            < "$APP_DIR/db/11_v43_expense_heads.sql"

          echo "v4.3 migration executed."

          echo ""
          echo "======================================"
          echo "10. Verifying v4.3 database"
          echo "======================================"

          EXPENSE_HEADS_TABLE=$(
            docker compose exec -T db \
              sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -s aequm_billing -e "
                SELECT COUNT(*)
                FROM INFORMATION_SCHEMA.TABLES
                WHERE TABLE_SCHEMA = '\''aequm_billing'\''
                  AND TABLE_NAME = '\''expense_heads'\'';
              "'
          )

          echo "expense_heads = $EXPENSE_HEADS_TABLE"

          if [ "$EXPENSE_HEADS_TABLE" != "1" ]; then
            echo "ERROR: expense_heads table was not created."
            exit 1
          fi

          EXPENSE_PERMISSION=$(
            docker compose exec -T db \
              sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -s aequm_billing -e "
                SELECT COUNT(*)
                FROM group_perms
                WHERE perm = '\''expenses'\'';
              "'
          )

          echo "expenses permissions = $EXPENSE_PERMISSION"

          if [ "$EXPENSE_PERMISSION" = "0" ]; then
            echo "ERROR: expenses permission was not created."
            exit 1
          fi

          echo "v4.3 database verified."

          echo ""
          echo "======================================"
          echo "11. Rebuilding API and UI"
          echo "======================================"

          docker compose build api ui

          echo ""
          echo "======================================"
          echo "12. Restarting API and UI"
          echo "======================================"

          docker compose up -d api ui

          echo ""
          echo "======================================"
          echo "13. Restoring billing-ui network"
          echo "======================================"

          docker network connect \
            --alias billing-ui \
            projectsystem_default \
            aequm-billing-ui-1 2>/dev/null || true

          echo "Billing UI network checked."

          echo ""
          echo "======================================"
          echo "14. Waiting for API"
          echo "======================================"

          HEALTHY=0

          for i in $(seq 1 30); do

            if curl -fsS \
              http://127.0.0.1:8000/api/health \
              > /dev/null 2>&1; then

              HEALTHY=1
              echo "Billing API is healthy."
              break
            fi

            echo "Waiting for API... attempt $i/30"
            sleep 2
          done

          if [ "$HEALTHY" != "1" ]; then

            echo ""
            echo "ERROR: Billing API failed health check."

            docker compose ps
            docker compose logs --tail=100 api

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "15. Final verification"
          echo "======================================"

          docker compose ps

          curl -fsS \
            http://127.0.0.1:8000/api/health

          echo ""

          echo ""
          echo "======================================"
          echo "Aequm Billing v4.3 deployment SUCCESS"
          echo "======================================"

          REMOTE_SCRIPT

          echo ""
          echo "======================================"
          echo "Remote deployment completed successfully."
          echo "======================================"