name: Aequm Billing CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aequm-production
  cancel-in-progress: false

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: |
          source venv/bin/activate
          pytest -q

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to Host iCare
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest

    steps:
      - name: Verify deployment SSH key
        env:
          DEPLOY_KEY: ${{ secrets.AEQUM_BILLING_SSH_KEY }}
        run: |
          printf '%s\n' "$DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          ssh-keygen -y -f /tmp/deploy_key > /tmp/deploy_key.pub
          ssh-keygen -lf /tmp/deploy_key.pub

      - name: Test direct SSH
        env:
          DEPLOY_KEY: ${{ secrets.AEQUM_BILLING_SSH_KEY }}
        run: |
          printf '%s\n' "$DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          ssh-keygen -y -f /tmp/deploy_key > /tmp/deploy_key.pub

          ssh -vvv \
            -i /tmp/deploy_key \
            -p 3052 \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            root@103.17.193.174 \
            "echo SSH_AUTH_OK"

      - name: Deploy to Host iCare
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          port: 3052
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.AEQUM_BILLING_SSH_KEY }}

          script: |
            set -e
            set -o pipefail

            APP_DIR="/opt/aequm-billing"
            BACKUP_DIR="$APP_DIR/backups"
            TIMESTAMP="$(date +%Y%m%d_%H%M%S)"
            RELEASE_DIR="/tmp/aequm-release-$TIMESTAMP"

            echo "======================================"
            echo "Aequm Billing v4.2 deployment"
            echo "======================================"

            cd "$APP_DIR"

            echo "Checking production containers..."
            docker compose ps

            echo "Creating production database backup..."

            mkdir -p "$BACKUP_DIR"

            BACKUP_FILE="$BACKUP_DIR/aequm_billing_${TIMESTAMP}.sql.gz"

            docker exec billing-mysql \
              mysqldump \
              --single-transaction \
              --routines \
              --triggers \
              aequm_billing \
              | gzip > "$BACKUP_FILE"

            test -s "$BACKUP_FILE"

            echo "Database backup completed:"
            echo "$BACKUP_FILE"

            echo "Fetching latest repository..."

            git fetch origin main

            DEPLOY_COMMIT="${{ github.sha }}"

            echo "Deployment commit:"
            echo "$DEPLOY_COMMIT"

            rm -rf "$RELEASE_DIR"

            git worktree add --detach "$RELEASE_DIR" "$DEPLOY_COMMIT"

            echo "Release created:"
            git -C "$RELEASE_DIR" log -1 --oneline

            echo "Updating backend source..."

            rsync -a \
              --exclude='.venv/' \
              --exclude='venv/' \
              --exclude='__pycache__/' \
              --exclude='run.sh' \
              "$RELEASE_DIR/backend/" \
              "$APP_DIR/backend/"

            echo "Updating frontend source..."

            rsync -a \
              --exclude='node_modules/' \
              --exclude='dist/' \
              "$RELEASE_DIR/frontend/" \
              "$APP_DIR/frontend/"

            echo "Updating database migration files..."

            mkdir -p "$APP_DIR/db"

            cp "$RELEASE_DIR/db/10_v42_employees_bank_links.sql" \
              "$APP_DIR/db/10_v42_employees_bank_links.sql"

            echo "Checking v4.2 database migration..."

            EMPLOYEES_TABLE=$(docker exec billing-mysql \
              mysql -N -s aequm_billing -e "
                SELECT COUNT(*)
                FROM INFORMATION_SCHEMA.TABLES
                WHERE TABLE_SCHEMA = 'aequm_billing'
                  AND TABLE_NAME = 'employees';
              ")

            STMT_LINKS_TABLE=$(docker exec billing-mysql \
              mysql -N -s aequm_billing -e "
                SELECT COUNT(*)
                FROM INFORMATION_SCHEMA.TABLES
                WHERE TABLE_SCHEMA = 'aequm_billing'
                  AND TABLE_NAME = 'stmt_txn_links';
              ")

            echo "employees table = $EMPLOYEES_TABLE"
            echo "stmt_txn_links table = $STMT_LINKS_TABLE"

            if [ "$EMPLOYEES_TABLE" = "0" ] || [ "$STMT_LINKS_TABLE" = "0" ]; then

              echo "Applying v4.2 database migration..."

              docker exec -i billing-mysql \
                mysql aequm_billing \
                < "$APP_DIR/db/10_v42_employees_bank_links.sql"

              echo "v4.2 migration completed."

            else

              echo "v4.2 migration already present."
              echo "No database migration required."

            fi

            echo "Rebuilding Billing containers..."

            docker compose build billing-api billing-ui

            echo "Restarting Billing application..."

            docker compose up -d billing-api billing-ui

            echo "Waiting for Billing API..."

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/api/health > /dev/null 2>&1; then
                echo "Billing API is healthy."
                break
              fi

              sleep 2
            done

            curl -fsS http://127.0.0.1:8000/api/health > /dev/null

            echo "Checking Billing containers..."

            docker compose ps

            echo "Cleaning temporary worktree..."

            cd "$APP_DIR"

            git worktree remove --force "$RELEASE_DIR" || true

            echo "======================================"
            echo "Aequm Billing v4.2 deployment successful"
            echo "======================================"