name: Aequm Billing CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aequm-production
  cancel-in-progress: false

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: |
          source venv/bin/activate
          pytest -q

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to EC2
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e
            set -o pipefail

            APP_DIR="/home/ubuntu/aqqum-billing"
            BACKUP_DIR="$APP_DIR/backups"
            TIMESTAMP="$(date +%Y%m%d_%H%M%S)"
            RELEASE_DIR="/tmp/aequm-release-$TIMESTAMP"

            echo "======================================"
            echo "Starting Aequm Billing production deployment"
            echo "======================================"

            cd "$APP_DIR"

            # --------------------------------------------------
            # 1. BACKUP PRODUCTION DATABASE FIRST
            # --------------------------------------------------

            echo "Creating production database backup..."

            sudo mkdir -p "$BACKUP_DIR"

            BACKUP_FILE="$BACKUP_DIR/aequm_billing_${TIMESTAMP}.sql.gz"

            sudo mysqldump \
              --single-transaction \
              --routines \
              --triggers \
              aequm_billing \
              | gzip \
              | sudo tee "$BACKUP_FILE" > /dev/null

            sudo test -s "$BACKUP_FILE"

            echo "Database backup completed: $BACKUP_FILE"

            # --------------------------------------------------
            # 2. FETCH EXACT MAIN COMMIT
            # --------------------------------------------------

            echo "Fetching latest main..."

            git fetch origin main

            echo "Production target commit:"
            git rev-parse origin/main

            # --------------------------------------------------
            # 3. CREATE TEMPORARY DEPLOYMENT WORKTREE
            # --------------------------------------------------

            echo "Creating temporary deployment worktree..."

            rm -rf "$RELEASE_DIR"

            git worktree add --detach "$RELEASE_DIR" origin/main

            echo "Release commit:"
            git -C "$RELEASE_DIR" log -1 --oneline

            # --------------------------------------------------
            # 4. UPDATE BACKEND SOURCE
            # --------------------------------------------------

            echo "Updating backend source..."

            rsync -a \
              --exclude='.venv/' \
              --exclude='venv/' \
              --exclude='__pycache__/' \
              --exclude='run.sh' \
              "$RELEASE_DIR/backend/" \
              "$APP_DIR/backend/"

            # --------------------------------------------------
            # 5. UPDATE FRONTEND SOURCE
            # --------------------------------------------------

            echo "Updating frontend source..."

            rsync -a \
              --exclude='node_modules/' \
              --exclude='dist/' \
              --exclude='current/' \
              "$RELEASE_DIR/frontend/" \
              "$APP_DIR/frontend/"

            # --------------------------------------------------
            # 6. INSTALL BACKEND DEPENDENCIES
            # --------------------------------------------------

            echo "Installing backend dependencies..."

            cd "$APP_DIR/backend"

            source venv/bin/activate

            pip install --upgrade pip setuptools wheel
            pip install -r requirements.txt

            # --------------------------------------------------
            # 7. VERIFY v2.2 DATABASE MIGRATION
            # --------------------------------------------------

            echo "Checking v2.2 database schema..."

            STATUS_COLUMN=$(sudo mysql -N -s aequm_billing -e "
              SELECT COUNT(*)
              FROM INFORMATION_SCHEMA.COLUMNS
              WHERE TABLE_SCHEMA = 'aequm_billing'
                AND TABLE_NAME = 'invoices'
                AND COLUMN_NAME = 'status';
            ")

            REVERSAL_COLUMN=$(sudo mysql -N -s aequm_billing -e "
              SELECT COUNT(*)
              FROM INFORMATION_SCHEMA.COLUMNS
              WHERE TABLE_SCHEMA = 'aequm_billing'
                AND TABLE_NAME = 'payments'
                AND COLUMN_NAME = 'reverses_id';
            ")

            echo "invoices.status = $STATUS_COLUMN"
            echo "payments.reverses_id = $REVERSAL_COLUMN"

            if [ "$STATUS_COLUMN" = "0" ] && [ "$REVERSAL_COLUMN" = "0" ]; then

              echo "Applying v2.2 migration..."

              sudo mysql aequm_billing < "$RELEASE_DIR/db/03_cancel_and_gstr.sql"

              echo "v2.2 migration completed."

            elif [ "$STATUS_COLUMN" = "1" ] && [ "$REVERSAL_COLUMN" = "1" ]; then

              echo "v2.2 migration already applied."

            else

              echo "ERROR: Production database has a partial v2.2 migration."
              exit 1

            fi

            # --------------------------------------------------
            # 8. VERIFY v2.4 DATABASE MIGRATION
            # --------------------------------------------------

            echo "Checking v2.4 database schema..."

            V24_COLUMNS=$(sudo mysql -N -s aequm_billing -e "
              SELECT COUNT(*)
              FROM INFORMATION_SCHEMA.COLUMNS
              WHERE TABLE_SCHEMA = 'aequm_billing'
                AND (
                  (TABLE_NAME = 'tenants' AND COLUMN_NAME IN (
                    'bank_name',
                    'bank_ifsc',
                    'bank_account',
                    'fy_start_month',
                    'fy_start_day',
                    'inv_fy',
                    'po_fy',
                    'vinv_prefix',
                    'vinv_seq',
                    'vinv_fy',
                    'cust_prefix',
                    'cust_seq',
                    'vend_prefix',
                    'vend_seq',
                    'mat_prefix',
                    'mat_seq'
                  ))
                  OR (TABLE_NAME = 'invoices' AND COLUMN_NAME IN (
                    'subject',
                    'instructions'
                  ))
                  OR (TABLE_NAME = 'invoice_lines' AND COLUMN_NAME = 'descr2')
                  OR (TABLE_NAME = 'po_lines' AND COLUMN_NAME = 'descr2')
                  OR (TABLE_NAME = 'vendor_invoice_lines' AND COLUMN_NAME = 'descr2')
                  OR (TABLE_NAME = 'customers' AND COLUMN_NAME = 'logo')
                  OR (TABLE_NAME = 'vendors' AND COLUMN_NAME = 'logo')
                  OR (TABLE_NAME = 'vendor_invoices' AND COLUMN_NAME = 'our_no')
                );
            ")

            V24_TABLE=$(sudo mysql -N -s aequm_billing -e "
              SELECT COUNT(*)
              FROM INFORMATION_SCHEMA.TABLES
              WHERE TABLE_SCHEMA = 'aequm_billing'
                AND TABLE_NAME = 'doc_sequences';
            ")

            echo "v2.4 columns = $V24_COLUMNS / 24"
            echo "doc_sequences = $V24_TABLE"

            if [ "$V24_COLUMNS" = "0" ] && [ "$V24_TABLE" = "0" ]; then

              echo "Applying v2.4 database migration..."

              sudo mysql aequm_billing < "$RELEASE_DIR/aequm_safe_upgrade_v24.sql"

              echo "v2.4 migration completed."

            elif [ "$V24_COLUMNS" = "24" ] && [ "$V24_TABLE" = "1" ]; then

              echo "v2.4 migration already applied."

            else

              echo "ERROR: Production database has a partial v2.4 migration."
              echo "Migration was NOT executed."
              exit 1

            fi

            # --------------------------------------------------
            # IMPORTANT DATABASE SAFETY RULE
            # --------------------------------------------------
            # NEVER run:
            #
            # db/01_schema.sql
            # db/02_seed.sql
            #
            # Existing production business data must remain intact.
            # --------------------------------------------------

            # --------------------------------------------------
            # 9. BACKEND HEALTH
            # --------------------------------------------------

            echo "Restarting backend..."

            sudo systemctl restart billing.service

            sleep 3

            sudo systemctl is-active --quiet billing.service

            curl -fsS http://127.0.0.1:8000/docs > /dev/null

            echo "Backend is healthy."

            # --------------------------------------------------
            # 10. BUILD FRONTEND
            # --------------------------------------------------

            echo "Building frontend..."

            cd "$APP_DIR/frontend"

            npm ci
            npm run build

            # --------------------------------------------------
            # 11. ATOMIC FRONTEND DEPLOYMENT
            # --------------------------------------------------

            echo "Deploying frontend..."

            NEW_FRONTEND="$APP_DIR/frontend/current_new_$TIMESTAMP"
            OLD_FRONTEND="$APP_DIR/frontend/current_previous_$TIMESTAMP"

            sudo rm -rf "$NEW_FRONTEND"
            sudo mkdir -p "$NEW_FRONTEND"

            sudo cp -a dist/. "$NEW_FRONTEND/"

            sudo chown -R www-data:www-data "$NEW_FRONTEND"
            sudo chmod -R 755 "$NEW_FRONTEND"

            if [ -d "$APP_DIR/frontend/current" ]; then
              sudo mv "$APP_DIR/frontend/current" "$OLD_FRONTEND"
            fi

            sudo mv "$NEW_FRONTEND" "$APP_DIR/frontend/current"

            # --------------------------------------------------
            # 12. RELOAD NGINX
            # --------------------------------------------------

            echo "Reloading nginx..."

            sudo nginx -t
            sudo systemctl reload nginx

            # --------------------------------------------------
            # 13. FRONTEND HEALTH
            # --------------------------------------------------

            curl -fsS http://127.0.0.1/ > /dev/null

            echo "Frontend is healthy."

            # --------------------------------------------------
            # 14. CLEAN TEMPORARY WORKTREE
            # --------------------------------------------------

            cd "$APP_DIR"

            git worktree remove --force "$RELEASE_DIR"

            echo "======================================"
            echo "Aequm Billing deployment successful"
            echo "======================================"
