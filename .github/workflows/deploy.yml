name: Aequm Billing Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aequm-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Billing v4.3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Host iCare
        env:
          DEPLOY_KEY: ${{ secrets.AEQUM_BILLING_SSH_KEY }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          set -e
          set -o pipefail

          echo "Preparing SSH key..."

          printf '%s\n' "$DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          echo "Testing SSH connection..."

          ssh \
            -i /tmp/deploy_key \
            -p 3052 \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            root@103.17.193.174 \
            "echo SSH_AUTH_OK"

          echo "Starting Billing deployment..."

          ssh \
            -i /tmp/deploy_key \
            -p 3052 \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            root@103.17.193.174 \
            "DEPLOY_COMMIT='$DEPLOY_COMMIT' bash -s" <<'REMOTE_SCRIPT'

          set -e
          set -o pipefail

          APP_DIR="/opt/aequm-billing"
          BACKUP_DIR="$APP_DIR/backups"
          TIMESTAMP="$(date +%Y%m%d_%H%M%S)"
          RELEASE_DIR="/tmp/aequm-release-$TIMESTAMP"

          echo "======================================"
          echo "Aequm Billing v4.3 deployment"
          echo "======================================"

          cd "$APP_DIR"

          echo ""
          echo "======================================"
          echo "1. Production container check"
          echo "======================================"

          docker compose ps

          echo ""
          echo "======================================"
          echo "2. Creating production DB backup"
          echo "======================================"

          mkdir -p "$BACKUP_DIR"

          BACKUP_FILE="$BACKUP_DIR/aequm_billing_${TIMESTAMP}.sql.gz"

          docker compose exec -T db \
            sh -c 'mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" \
              --single-transaction \
              --routines \
              --triggers \
              aequm_billing' \
            | gzip > "$BACKUP_FILE"

          test -s "$BACKUP_FILE"

          gzip -t "$BACKUP_FILE"

          echo "Database backup completed:"
          echo "$BACKUP_FILE"

          echo ""
          echo "======================================"
          echo "3. Fetching deployment commit"
          echo "======================================"

          git fetch origin main

          echo "Deployment commit:"
          echo "$DEPLOY_COMMIT"

          echo ""
          echo "======================================"
          echo "4. Creating release worktree"
          echo "======================================"

          rm -rf "$RELEASE_DIR"

          git worktree add --detach "$RELEASE_DIR" "$DEPLOY_COMMIT"

          echo "Release created:"
          git -C "$RELEASE_DIR" log -1 --oneline

          echo ""
          echo "======================================"
          echo "5. Updating backend source"
          echo "======================================"

          tar \
            -C "$RELEASE_DIR/backend" \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='run.sh' \
            -cf - . \
            | tar -C "$APP_DIR/backend" -xf -

          echo "Backend source updated."

          echo ""
          echo "======================================"
          echo "6. Updating frontend source"
          echo "======================================"

          tar \
            -C "$RELEASE_DIR/frontend" \
            --exclude='node_modules' \
            --exclude='dist' \
            -cf - . \
            | tar -C "$APP_DIR/frontend" -xf -

          echo "Frontend source updated."

          echo ""
          echo "======================================"
          echo "7. Updating v4.3 migration"
          echo "======================================"

          mkdir -p "$APP_DIR/db"

          test -f "$RELEASE_DIR/db/11_v43_expense_heads.sql"

          cp \
            "$RELEASE_DIR/db/11_v43_expense_heads.sql" \
            "$APP_DIR/db/11_v43_expense_heads.sql"

          echo "v4.3 migration file updated."

          echo ""
          echo "======================================"
          echo "8. Checking v4.3 database migration"
          echo "======================================"

          EXPENSE_HEADS_TABLE=$(docker compose exec -T db \
            sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -s aequm_billing -e "
              SELECT COUNT(*)
              FROM INFORMATION_SCHEMA.TABLES
              WHERE TABLE_SCHEMA = '\''aequm_billing'\''
                AND TABLE_NAME = '\''expense_heads'\'';
            "')

          echo "expense_heads table = $EXPENSE_HEADS_TABLE"

          if [ "$EXPENSE_HEADS_TABLE" = "0" ]; then

            echo ""
            echo "Applying v4.3 database migration..."

            docker compose exec -T db \
              sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" aequm_billing' \
              < "$APP_DIR/db/11_v43_expense_heads.sql"

            echo "v4.3 migration completed."

          else

            echo ""
            echo "v4.3 migration already present."
            echo "No database migration required."

          fi

          echo ""
          echo "======================================"
          echo "9. Rebuilding Billing containers"
          echo "======================================"

          docker compose build api ui

          echo ""
          echo "======================================"
          echo "10. Restarting Billing application"
          echo "======================================"

          docker compose up -d api ui

          echo ""
          echo "======================================"
          echo "11. Waiting for Billing API"
          echo "======================================"

          HEALTHY=0

          for i in $(seq 1 30); do

            if curl -fsS \
              http://127.0.0.1:8000/api/health \
              > /dev/null 2>&1; then

              echo "Billing API is healthy."
              HEALTHY=1
              break

            fi

            echo "Waiting for API... attempt $i/30"
            sleep 2

          done

          if [ "$HEALTHY" != "1" ]; then

            echo ""
            echo "======================================"
            echo "ERROR: Billing API is unhealthy"
            echo "======================================"

            echo ""
            echo "Container status:"
            docker compose ps

            echo ""
            echo "Billing API logs:"
            docker compose logs --tail=100 api

            exit 1

          fi

          curl -fsS \
            http://127.0.0.1:8000/api/health \
            > /dev/null

          echo ""
          echo "======================================"
          echo "12. Final container check"
          echo "======================================"

          docker compose ps

          echo ""
          echo "======================================"
          echo "13. Cleaning release worktree"
          echo "======================================"

          cd "$APP_DIR"

          git worktree remove \
            --force "$RELEASE_DIR" || true

          echo ""
          echo "======================================"
          echo "Aequm Billing v4.3 deployment successful"
          echo "======================================"

          REMOTE_SCRIPT

          echo ""
          echo "Deployment completed successfully."