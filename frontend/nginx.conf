server {
  listen 80;

  client_max_body_size 25M;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
